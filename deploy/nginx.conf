# Ride Together — production nginx
# Замените YOUR_DOMAIN на ваш домен, затем:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/ride-together
#   sudo ln -sf /etc/nginx/sites-available/ride-together /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream ride_backend {
    server 127.0.0.1:3001;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    root /var/www/ride-together/dist;
    index index.html;

    access_log /var/log/nginx/ride-together-access.log;
    error_log /var/log/nginx/ride-together-error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # API
    location /api/ {
        proxy_pass http://ride_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket (чат, геолокация)
    location /socket.io/ {
        proxy_pass http://ride_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Health check (опционально снаружи)
    location = /health {
        proxy_pass http://ride_backend;
    }

    # Статика с кэшем
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(js|css|svg|woff2?|ico|png|jpg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~ /\. {
        deny all;
    }
}
